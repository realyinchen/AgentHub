# AgentHub Full-Stack Docker Compose
#
# Prerequisites:
# - Create the data directory: mkdir -p /home/user/agenthub/pg
# - Copy .env.example to .env in backend and frontend directories
# - Edit backend/.env to update POSTGRES_HOST=db
#
# Usage:
#   docker-compose up -d

networks:
  agenthub-network:
    driver: bridge

volumes:
  postgres_data:

services:
  # PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: agenthub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langgraph
      POSTGRES_DB: agentdb
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql
      - ./backend/scripts/sql/init_database.sql:/docker-entrypoint-initdb.d/02-init_database.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d agentdb"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - agenthub-network

  # FastAPI Backend
  backend:
    image: agenthub-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenthub-backend
    restart: unless-stopped
    networks:
      - agenthub-network
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # Override database host to use the db service
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 2
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # React Frontend with Nginx
  frontend:
    image: agenthub-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenthub-frontend
    restart: unless-stopped
    networks:
      - agenthub-network
    env_file:
      - ./frontend/.env
    environment:
      NGINX_BACKEND_HOST: backend
      NGINX_BACKEND_PORT: 8080
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy